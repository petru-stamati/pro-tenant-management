services:
  - type: web
    name: pro-tenant-api
    runtime: node
    plan: free
    # Commands run from the monorepo root (no rootDir) — npm workspaces need
    # `npm install` at the root to link @pro-tenant/db correctly.
    buildCommand: npm install && npm run build --workspace=@pro-tenant/db && npm run build --workspace=@pro-tenant/api
    startCommand: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma && npm run start --workspace=@pro-tenant/api
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JWT_ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: CORS_ORIGIN
        sync: false
